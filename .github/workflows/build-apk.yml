name: Build Minecraft GitSync Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Make Gradlew Executable
      run: chmod +x gradlew || true

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Verify APK Output
      run: |
        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        if [ -f "$APK_PATH" ]; then
          echo "Found APK at $APK_PATH"
          ls -lh "$APK_PATH"
        else
          echo "Looking for generated APKs:"
          find app/build/outputs/apk -name "*.apk"
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Publish APK to GitHub Releases
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0
        name: "Minecraft GitSync v1.1.0"
        body: |
          ### Minecraft GitSync Android Debug APK
          - **Devices:** Galaxy M30s (Android 11) + Friend Phones (Android 11 & Android 15).
          - **Cloudflare Integration:** Connected to `spring-paper-f60a.xmenlittlegamer.workers.dev` in room `friendgroup123`.
          - **World Storage:** Cloudflare R2 chunked snapshot storage + streaming SHA-256 verification.
          - **Safety:** Single Active Player Lock (World Editing Lease) & LevelDB write settling detection.
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

